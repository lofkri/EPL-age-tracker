name: Update EPL minute-adjusted age data

on:
  schedule:
    # Tuesdays 10:00 UTC (safely after Monday night fixtures finish)
    - cron: '0 10 * * 2'
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch fixtures and recompute ages
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python fetch_and_compute.py

      - name: Commit and push data updates
        run: |
          git config user.name "epl-age-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes this run."
          else
            git commit -m "Update EPL age data ($(date -u +%F))"
            git push
          fi
