name: Backfill a past season

on:
  workflow_dispatch:
    inputs:
      season:
        description: 'Season start year, e.g. 2025 for the 2025-26 season'
        required: true
        default: '2025'

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Backfill season
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python backfill_season.py ${{ inputs.season }}

      - name: Commit and push backfilled data
        run: |
          git config user.name "epl-age-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/seasons/
          if git diff --cached --quiet; then
            echo "No data changes this run."
          else
            git commit -m "Backfill ${{ inputs.season }} season data"
            git push
          fi
